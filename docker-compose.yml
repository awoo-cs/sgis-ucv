services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgis_db}
      POSTGRES_USER: ${POSTGRES_USER:-sgis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgis_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgis_user} -d ${POSTGRES_DB:-sgis_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend:/app
    ports:
      # Puerto host configurable (default 8001) para no chocar con otros
      # servicios en 8000. El frontend habla con backend:8000 por la red interna.
      - "${BACKEND_PORT:-8001}:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py makemigrations accounts incidents action_plans &&
             python manage.py migrate &&
             python manage.py loaddata initial_data.json 2>/dev/null || true &&
             python manage.py create_demo_data 2>/dev/null || true &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  pgdata:
